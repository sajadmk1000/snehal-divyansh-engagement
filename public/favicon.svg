<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="gold-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24190e" />
      <stop offset="70%" stop-color="#120c07" />
      <stop offset="100%" stop-color="#070402" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0" />
      <stop offset="35%" stop-color="#f5d77f" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>
  </defs>

  <!-- Dark Royal Circle Background with Gold Border -->
  <circle cx="50" cy="50" r="48" fill="url(#gold-bg)" stroke="url(#gold-grad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gold-grad)" stroke-width="0.8" opacity="0.6" />

  <!-- 2 Intertwined Gold Wedding Rings Emblem -->
  <g transform="translate(50, 36) scale(0.65)">
    <circle cx="-14" cy="0" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="4.5" />
    <circle cx="14" cy="0" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="4.5" />
    <!-- Solitaire Diamond Peak -->
    <polygon points="-14,-22 -18,-29 -10,-29" fill="url(#gold-grad)" />
    <polygon points="14,-22 10,-29 18,-29" fill="url(#gold-grad)" />
  </g>

  <!-- Monogram A & M -->
  <text x="50" y="76" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-weight="bold" font-size="21" fill="url(#gold-grad)" letter-spacing="1">
    A&amp;M
  </text>
</svg>